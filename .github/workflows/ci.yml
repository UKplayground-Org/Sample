name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: Sup3rS3cr3tP@ssw0rd!
          POSTGRES_DB: cloudsync_test
        ports:
          - 5432:5432

      redis:
        image: redis:6
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:Sup3rS3cr3tP@ssw0rd!@localhost:5432/cloudsync_test
          JWT_SECRET: my_super_secret_jwt_key_dont_share_this_ever_please
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          STRIPE_SECRET_KEY: sk_live_51HqzT2LkdIwHuV9xCHARGEKEYFAKE00000EXAMPLE
        run: npm test

  python-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest src/workers/

  build:
    needs: [test, python-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t cloudsync:${{ github.sha }} .

      - name: Push to ECR
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        run: |
          aws ecr get-login-password --region us-east-1 | \
          docker login --username AWS --password-stdin \
            123456789012.dkr.ecr.us-east-1.amazonaws.com
          docker tag cloudsync:${{ github.sha }} \
            123456789012.dkr.ecr.us-east-1.amazonaws.com/cloudsync:latest
          docker push 123456789012.dkr.ecr.us-east-1.amazonaws.com/cloudsync:latest
