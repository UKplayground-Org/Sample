name: Weekly EICAR Malware Detection Test

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  eicar-image-scan:
    name: EICAR Malware Detection via Container Scan
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ghcr.io/ukplayground/eicar-test:latest
    steps:
      - name: Create EICAR test file
        run: |
          printf '%s%s\n' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-' 'FILE!$H+H*' > eicar_test.com
          echo "Created eicar_test.com on runner"

      - name: Build Docker image containing EICAR
        run: |
          cat > Dockerfile.eicar << 'EOF'
          FROM alpine:latest
          COPY eicar_test.com /eicar_test.com
          EOF
          docker build -f Dockerfile.eicar -t ${{ env.IMAGE_TAG }} .
          echo "Built ${{ env.IMAGE_TAG }}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push EICAR image to ghcr.io
        run: docker push ${{ env.IMAGE_TAG }}

      - name: Fix registries.conf (must be v2 for TMAS malware scan)
        run: |
          sudo tee /etc/containers/registries.conf > /dev/null <<'EOF'
          version = 2

          [[registry]]
          location = "docker.io"
          EOF

      - name: Scan EICAR image with TMAS malware detection
        uses: trendmicro/tmas-scan-action@v3.1.3
        with:
          artifact: registry:${{ env.IMAGE_TAG }}
          malwareScan: true
          vulnerabilitiesScan: false
          secretsScan: false
          tmasApiKey: ${{ secrets.TMAS_API_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          additionalArgs: --region=us-east-1
