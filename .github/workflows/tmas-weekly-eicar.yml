name: Weekly EICAR Malware Detection Test

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  eicar-image-scan:
    name: EICAR Malware Detection via Container Scan
    runs-on: ubuntu-22.04
    steps:
      - name: Create EICAR test file
        run: |
          printf '%s%s\n' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-' 'FILE!$H+H*' > eicar_test.com
          echo "Created eicar_test.com on runner (not committed to repo)"

      - name: Build minimal Docker image containing EICAR
        run: |
          printf 'FROM scratch\nCOPY eicar_test.com /eicar_test.com\n' > Dockerfile.eicar
          docker build -f Dockerfile.eicar -t eicar-test:latest .
          echo "Built eicar-test:latest image"

      - name: Scan EICAR image with TMAS malware detection
        uses: trendmicro/tmas-scan-action@v3.1.3
        with:
          artifact: image:eicar-test:latest
          malwareScan: true
          vulnerabilitiesScan: false
          secretsScan: false
          tmasApiKey: ${{ secrets.TMAS_API_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          additionalArgs: --region=eu-central-1
