name: Weekly EICAR Malware Detection Test

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  eicar-image-scan:
    name: EICAR Malware Detection via Container Scan
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Create EICAR test file
        run: |
          printf '%s%s\n' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-' 'FILE!$H+H*' > eicar_test.com
          echo "Created eicar_test.com on runner"

      # GHCR ties push permission to the repo's current owning org via GITHUB_TOKEN,
      # so the image path must track github.repository_owner rather than a hardcoded
      # org name (this broke after the Ukplayground -> UKplayground-Org move).
      - name: Set image name
        id: image
        run: |
          echo "tag=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/eicar-test:latest" >> $GITHUB_OUTPUT

      - name: Build Docker image containing EICAR
        run: |
          cat > Dockerfile.eicar << 'EOF'
          FROM alpine:latest
          COPY eicar_test.com /eicar_test.com
          EOF
          docker build -f Dockerfile.eicar -t ${{ steps.image.outputs.tag }} .
          echo "Built ${{ steps.image.outputs.tag }}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push EICAR image to ghcr.io
        run: docker push ${{ steps.image.outputs.tag }}

      - name: Fix registries.conf (must be v2 for TMAS malware scan)
        run: |
          sudo tee /etc/containers/registries.conf > /dev/null <<'EOF'
          version = 2

          [[registry]]
          location = "docker.io"
          EOF

      - name: Scan EICAR image with TMAS malware detection
        uses: trendmicro/tmas-scan-action@v3.1.3
        with:
          artifact: registry:${{ steps.image.outputs.tag }}
          malwareScan: true
          vulnerabilitiesScan: false
          secretsScan: false
          tmasApiKey: ${{ secrets.TMAS_API_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          additionalArgs: --region=us-east-1
