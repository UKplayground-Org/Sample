name: Weekly TMAS EICAR Malware Test

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  tmas-eicar-scan:
    name: TMAS EICAR Malware Scan
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create EICAR test file at runtime
        run: |
          printf '%s%s\n' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-' 'FILE!$H+H*' > eicar_test.txt
          echo "EICAR test file created on runner only - never committed to repo"

      - name: Scan with TMAS - expect malware detection
        uses: trendmicro/tmas-scan-action@v3.1.3
        with:
          version: '2'
          vulnerabilitiesScan: false
          malwareScan: true
          secretsScan: false
          artifact: dir:.
          additionalArgs: --region=eu-central-1
          tmasApiKey: ${{ secrets.TMAS_API_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm malware was detected
        if: failure()
        run: echo "EICAR detected as expected - TMAS malware scanning is working correctly"
