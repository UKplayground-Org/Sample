name: Security Scan (TMAS)

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

# Required for TMAS to post scan comments and query pull requests
permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tmas-source-scan:
    name: TMAS Source Code Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run TMAS Source Scan
        uses: trendmicro/tmas-scan-action@v3.1.3
        with:
          artifact: dir:.
          vulnerabilitiesScan: true
          secretsScan: true
          tmasApiKey: ${{ secrets.TMAS_API_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          additionalArgs: --region=us-east-1

  tmas-image-scan:
    name: TMAS Container Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t cloudsync:scan-${{ github.sha }} .

      - name: Run TMAS Image Scan
        uses: trendmicro/tmas-scan-action@v3.1.3
        with:
          artifact: docker:cloudsync:scan-${{ github.sha }}
          vulnerabilitiesScan: true
          secretsScan: true
          malwareScan: true
          tmasApiKey: ${{ secrets.TMAS_API_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          additionalArgs: --region=us-east-1
