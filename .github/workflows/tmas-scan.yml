name: Security Scan (TMAS)

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tmas-source-scan:
    name: TMAS Source Code Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run TMAS Source Scan
        uses: trendmicro/tmas-scan-action@v3.1.3
        with:
          artifact: dir:.
          vulnerabilitiesScan: true
          secretsScan: true
          malwareScan: false
          tmasApiKey: ${{ secrets.TMAS_API_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          additionalArgs: --region=us-east-1
